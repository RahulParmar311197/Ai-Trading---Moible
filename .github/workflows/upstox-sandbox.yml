name: Upstox Sandbox Smoke

on:
  workflow_dispatch:

jobs:
  sandbox-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run Upstox sandbox place/cancel smoke test
        env:
          UPSTOX_SANDBOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_SANDBOX_ACCESS_TOKEN }}
        run: pytest -q tests/test_upstox_sandbox.py -m integration
