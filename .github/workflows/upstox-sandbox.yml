name: Upstox Sandbox Smoke

on:
  workflow_dispatch:

jobs:
  sandbox-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify sandbox token is configured
        env:
          UPSTOX_SANDBOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_SANDBOX_ACCESS_TOKEN }}
        run: |
          test -n "$UPSTOX_SANDBOX_ACCESS_TOKEN"
          echo "UPSTOX_SANDBOX_ACCESS_TOKEN is configured for this workflow run."
      - name: Diagnose Upstox sandbox network reachability
        continue-on-error: true
        run: |
          python - <<'PY'
          import socket
          import time
          import urllib.request
          import urllib.error

          host = "sandbox.upstox.com"
          url = "https://sandbox.upstox.com/v2/order/place"
          dns_ok = False
          last_error = None

          for attempt in range(1, 4):
              print(f"DNS attempt {attempt}/3: resolving {host}...")
              try:
                  addresses = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
                  if addresses:
                      dns_ok = True
                      print(f"DNS resolution succeeded with {len(addresses)} result(s).")
                      break
              except OSError as exc:
                  last_error = exc
                  print(f"DNS resolution failed: {exc!r}")
              if attempt < 3:
                  time.sleep(2)

          if not dns_ok:
              print(f"Sandbox DNS remains unavailable after retries: {last_error!r}")
              print("This diagnostic step is non-blocking; the real integration test remains authoritative.")
          else:
              print(f"Checking HTTPS reachability: {url}")
              request = urllib.request.Request(url, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      print(f"Sandbox endpoint reachable: HTTP {response.status}")
              except urllib.error.HTTPError as exc:
                  if exc.code in {400, 401, 403, 404, 405}:
                      print(f"Sandbox endpoint reachable: HTTP {exc.code}")
                  else:
                      print(f"Sandbox endpoint returned unexpected HTTP {exc.code}: {exc.reason}")
              except OSError as exc:
                  print(f"HTTPS connection failed: {exc!r}")
          PY
      - name: Run Upstox sandbox place/cancel smoke test
        env:
          UPSTOX_SANDBOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_SANDBOX_ACCESS_TOKEN }}
        run: pytest -q tests/test_upstox_sandbox.py -m integration
