name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check whether wrapper is already present
        id: wrapper
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stop when wrapper is already present
        if: steps.wrapper.outputs.present == 'true'
        run: echo "Official Gradle wrapper artifact is already present."
      - name: Download official Gradle 8.10.2 wrapper
        if: steps.wrapper.outputs.present != 'true'
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar
          echo "2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
      - name: Verify wrapper launcher files
        if: steps.wrapper.outputs.present != 'true'
        run: |
          test -f android/gradlew
          test -f android/gradlew.bat
          grep -F 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-bin.zip' android/gradle/wrapper/gradle-wrapper.properties
      - name: Commit wrapper artifact to main
        if: steps.wrapper.outputs.present != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradle/wrapper/gradle-wrapper.jar android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.properties
          git diff --cached --quiet || git commit -m "build(android): add official Gradle wrapper"
          git push
