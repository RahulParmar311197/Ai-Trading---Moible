name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_trading"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify official Upstox protobuf package
        run: python -c "from upstox_client.feeder.proto import MarketDataFeedV3_pb2; print(MarketDataFeedV3_pb2.__name__)"
      - run: pytest -q -m 'not integration'
      - run: pytest -q -m integration
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_trading
